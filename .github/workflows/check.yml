# The pre-deploy gate on every push and pull request: lint, unit tests, both builds, and the
# permission guard (the APK must never ask to go online). Same as `make check` locally.
name: check

on:
  push:
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The runner's preinstalled SDK (ANDROID_HOME) has cmdline-tools/latest; add what this project builds against.
      - name: Android SDK
        run: make sdk

      - name: make check
        run: make check

      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
