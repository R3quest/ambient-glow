# The lock flow on a real Android build: an Android 14 emulator (Pixel 6, stock Android), set up as a
# user has it, runs `make scenario` (messages through the real flow, nothing left behind) and the
# edge cases (`make edge`: bursts, Do Not Disturb, unlock and power with the LED lit, the process
# killed, low battery, Battery Saver, a call over the LED, GlowShield or the listener off, the
# notifications permission revoked). On pull requests, and by hand.
name: emulator

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The emulator needs KVM; the runner has it, behind a permission.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android SDK
        run: make sdk

      - name: Debug build
        run: make debug

      # Animations stay on: the effect and the LED keep real time whatever the scale, and the
      # lock screen's own timings are what the flow is tuned against.
      - name: Scenario and edge cases
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swangle_indirect
          script: |
            mkdir -p edge-logs
            ADB=adb scripts/emulator_setup.sh
            make scenario SCENARIO=all || { adb logcat -d -v time > edge-logs/scenario-logcat.txt; exit 1; }
            EDGE_LOGS=edge-logs ADB=adb python3 -I scripts/edge.py --skip monkey,big-text

      - name: Edge case logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: edge-logs
          path: edge-logs/
